<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask a Question · Support · Med Track</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script>if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');</script>
  <script src="/static/js/form-draft.js" defer></script>
  <style>
    * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1612; --bg-2: #211d18; --bg-3: #2a2520; --border: #3d3630;
      --text: #ede8e2; --muted: #9a8f85; --dim: #5e5650; --amber: #c9b99a;
      --danger: #f87171; --radius: 16px; --radius-sm: 8px;
      --glow: 0 4px 20px rgba(0, 0, 0, 0.50), 0 1px 4px rgba(0, 0, 0, 0.35);
    }
    html.light {
      --bg: #e6e0d7; --bg-2: #f5f2ec; --bg-3: #eae5de; --border: #c2a98a;
      --text: #1a1410; --muted: #6b5f55; --dim: #a89e94; --amber: #8a6520;
      --glow: 0 4px 16px rgba(60, 40, 20, 0.14), 0 1px 4px rgba(60, 40, 20, 0.10);
    }
    html, body { height: 100%; }
    html { background: var(--bg); }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px; line-height: 1.6; color: var(--text); background: transparent;
    }
    a { color: var(--muted); text-decoration: none; }

    .pn { position: sticky; top: 0; z-index: 100; background: #2e1e0c; display: flex;
      align-items: center; justify-content: space-between; padding: 0 32px; height: 52px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .pn-left { display: flex; align-items: center; gap: 16px; }
    .pn-back { font-size: 13px; color: #c9b99a; display: flex; align-items: center; gap: 6px;
      text-decoration: none; padding: 6px 12px; border: 1px solid rgba(201, 185, 154, 0.25);
      border-radius: 8px; transition: opacity 0.15s, border-color 0.15s, background 0.15s; }
    .pn-back:hover { color: #f0e6d4; border-color: rgba(201, 185, 154, 0.5); background: rgba(255, 255, 255, 0.04); }
    .pn-brand { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700;
      color: #ede8e2; text-decoration: none; letter-spacing: -0.3px; }

    .sup-wrap { max-width: 620px; margin: 0 auto; padding: 56px 24px 100px; }
    .sup-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700;
      color: var(--text); margin-bottom: 8px; }
    .sup-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

    .sup-form-group { margin-bottom: 20px; }
    .sup-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
    .sup-input, .sup-textarea {
      width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font-family: inherit; font-size: 14px; padding: 12px 14px; outline: none;
      transition: border-color .15s;
    }
    .sup-input:focus, .sup-textarea:focus { border-color: var(--amber); }
    .sup-textarea { min-height: 160px; resize: vertical; line-height: 1.6; }

    .sup-submit { width: 100%; text-align: center; font-size: 14px; font-weight: 600; color: #1a1612;
      background: var(--amber); padding: 13px 0; border-radius: var(--radius-sm); border: 0;
      cursor: pointer; font-family: inherit; transition: opacity .15s; }
    .sup-submit:hover { opacity: .9; }
    html.light .sup-submit { color: #fff; }

    .sup-alert { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25);
      color: var(--danger); font-size: 13px; padding: 12px 16px; border-radius: var(--radius-sm);
      margin-bottom: 20px; }
  </style>
</head>

<body>

  <nav class="pn">
    <div class="pn-left">
      <a href="/support" class="pn-back" aria-label="Back to support">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
        Back
      </a>
      <a href="/" class="pn-brand">Med Track</a>
    </div>
  </nav>

  <div class="sup-wrap">
    <h1 class="sup-title">Ask a question</h1>
    <p class="sup-sub">This will be posted publicly on the support board — other doctors can reply, and Med Track will post the final answer.</p>

    {% if error %}
    <div class="sup-alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/support/new">
      <div class="sup-form-group">
        <label class="sup-label" for="title">Question title</label>
        <input class="sup-input" type="text" id="title" name="title" maxlength="200"
          placeholder="e.g. How do I export my patient records?" value="{{ title or '' }}" required />
      </div>
      <div class="sup-form-group">
        <label class="sup-label" for="body">Details</label>
        <textarea class="sup-textarea" id="body" name="body" maxlength="5000"
          placeholder="Explain what you're trying to do and what's happening instead." required>{{ body or '' }}</textarea>
      </div>
      <button type="submit" class="sup-submit">Post question</button>
    </form>
  </div>

</body>
</html>
